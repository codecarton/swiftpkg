name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Unit tests
        run: swift test
      - name: Package integration verification
        run: ./scripts/verify-loop.sh
      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "v$(tr -d '\n' < VERSION)" = "${GITHUB_REF_NAME}"
          grep -Fq "let swiftpkgVersion = \"$(cat VERSION)\"" swiftpkg/Version.swift
