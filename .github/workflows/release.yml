name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate-unsigned-package-fallback:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Validate unsigned installer build
        env:
          UNSIGNED: '1'
          GH_PUBLISH: '0'
        run: ./scripts/release.sh
