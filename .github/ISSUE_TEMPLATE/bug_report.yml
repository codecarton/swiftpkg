name: Bug report
description: Report an unexpected swiftpkg result.
body:
  - type: input
    id: version
    attributes:
      label: swiftpkg version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and architecture
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected result
    validations:
      required: true
